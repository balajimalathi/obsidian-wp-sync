[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-vault-crawler"
version = "0.1.0"
description = "crawl4ai-based site crawler for Obsidian WordPress vault bootstrap"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "crawl4ai>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wp-vault-crawl = "wp_vault_crawler.crawl_site:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
